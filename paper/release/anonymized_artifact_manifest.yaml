known_exclusions:
  - raw_CIFAR10_data
  - model_weights
  - PNDM_checkpoint_files
  - raw_generated_text_to_image_sample_jpegs
  - raw_AYS_numeric_schedule_files
  - authorized_offline_numeric_schedule_bundles
  - local_environment_paths
open_blockers:
  - final_author_license_for_paper_produced_text_scripts_tables_figures_and_csvs
  - prompt_asset_author_license_decision
  - external_anonymized_archive_or_repository
