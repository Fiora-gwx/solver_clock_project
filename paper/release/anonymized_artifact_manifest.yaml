schema_version: 1
status: draft
last_updated: 2026-05-05
anonymization:
  path_policy: repository_relative_paths_only
  local_absolute_paths: removed_from_paper_facing_results
  author_identity: no author names or institution paths recorded here
paper_artifacts:
  manuscript:
    paths:
      - paper/neurips_2026.tex
      - paper/sections/
      - paper/appendix/
      - paper/checklist.tex
      - paper/references.bib
    role: manuscript_source
    release_status: include_after_author_license_decision
  cleaned_results:
    paths:
      - paper/results/smoke/
      - paper/results/pilot/
      - paper/results/cifar10_50k/
      - paper/results/t2i/
      - paper/results/cost/
      - paper/results/failure/
    role: paper_facing_aggregate_metrics_base_linear_karras_dgpde_schedule_metadata_and_authorized_offline_metrics
    release_status: include_after_path_sanitization_and_license_review
  generated_tables:
    paths:
      - paper/tables/
    role: latex_tables_generated_from_cleaned_results
    release_status: include_after_author_license_decision
  generated_figures:
    paths:
      - paper/figures/*.pdf
      - paper/figures/*.png
    role: data_driven_plots_and_selected_qualitative_failure_grid
    release_status: include_after_author_license_decision
  aggregation_scripts:
    paths:
      - paper/figures/src/
    role: scripts_that_regenerate_paper_tables_figures_and_cleaned_summaries
    release_status: include_after_code_license_decision
  draft_release_filelist:
    paths:
      - paper/release/build_draft_release_filelist.py
      - paper/release/build_draft_release_archive.py
      - paper/release/draft_release_filelist.txt
      - paper/release/draft_release_exclusions.txt
      - paper/release/dist/dgpde_neurips2026_draft_artifacts.zip
      - paper/release/dist/dgpde_neurips2026_draft_artifacts.sha256
    role: local_draft_allowlist_and_archive_for_anonymous_paper_artifact_package
    release_status: local_draft_archive_not_external_release
external_dependencies:
  cifar10:
    role: benchmark_dataset_and_fid_reference_statistics
    local_records:
      - configs/datasets/cifar10.yaml
      - configs/assets_manifest.yaml
    license_status: UCI_lists_CC_BY_4_0_for_dataset_page
    redistribution: do_not_bundle_raw_dataset_without_final_license_review
  pndm_cifar_checkpoint:
    role: controlled_CIFAR10_sampler_backend
    source_urls:
      - https://github.com/luping-liu/PNDM
      - https://drive.google.com/drive/folders/1leEpziaPdYlshzB4QALY5pL7Snw8XM28
    local_records:
      - configs/assets_manifest.yaml
      - checkpoints/pndm/models/ddim_cifar10.ckpt
