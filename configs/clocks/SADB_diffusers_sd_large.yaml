clock:
  family: SADB
  calibration_solver: euler
  model_output_type: epsilon
  physical_grid_size: 65
  physical_grid_mode: scheduler_sigmas
  pilot_batch_size: 8
  pilot_num_batches: 16
  pilot_observation_microbatch: 8
  pilot_prompt_asset: diffusers_smoke_prompts
  smoothing_window: 3
  epsilon: 1.0e-12
  q_min: 1.05
  q_max: 6.0
  max_dt_factor: 1.5
  max_neighbor_dt_ratio: 4.0
  cache_path: outputs/cache/sadb_profiles
  target_nfes: [10]
