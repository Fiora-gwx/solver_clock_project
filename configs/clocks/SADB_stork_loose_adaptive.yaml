clock:
  family: SADB
  calibration_solver: heun2
  model_output_type: epsilon

  physical_grid_size: 65
  pilot_batch_size: 8
  pilot_num_batches: 16
  pilot_observation_microbatch: 4

  pilot_prompt_asset: diffusers_smoke_prompts
  smoothing_window: 3
  epsilon: 1.0e-12
  q_min: 1.05
  q_max: 6.0
  cache_path: outputs/cache/sadb_profiles

  # Loose step-size limiter
  max_dt_factor: 1.5
  max_neighbor_dt_ratio: 4.0

  # STORK adaptive s
  adaptive_s: true
  adaptive_s_max: 100
  adaptive_s_reference: base_dt

  stork_first_step_factor: 0.5
  stork_warmup_steps: 1
  # fallback only; run_experiment_config 会用 experiment 的 eval_nfes 覆盖
  target_nfes: [5, 7, 9, 11, 15, 23, 31]