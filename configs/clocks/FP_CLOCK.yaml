clock:
  family: FP_CLOCK
  calibration_mode: fp_clock
  calibration_solver: target
  model_output_type: epsilon
  physical_grid_size: 65
  pilot_batch_size: 8
  pilot_num_batches: 4
  pilot_observation_microbatch: 4
  smoothing_window: 1
  epsilon: 1.0e-12
  q_min: 1.05
  q_max: 6.0
  target_nfes: [5, 7, 9, 11, 15, 23, 31]
