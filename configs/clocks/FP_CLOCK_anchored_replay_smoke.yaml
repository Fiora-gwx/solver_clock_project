clock:
  family: FP_CLOCK
  estimator: anchored_replay
  calibration_mode: fp_clock
  calibration_solver: target
  model_output_type: epsilon
  physical_grid_mode: anchored_base
  anchor_nfe: 16
  pilot_batch_size: 8
  pilot_num_batches: 4
  pilot_observation_microbatch: 2
  smoothing_window: 1
  epsilon: 1.0e-12
  q_min: 1.05
  q_max: 6.0
  target_nfes: [6, 10]
  heun_omitted: true
  heun_omitted_reason: "even-NFE smoke uses NFE 6/10; current vendor Heun contract only supports odd effective NFE"
