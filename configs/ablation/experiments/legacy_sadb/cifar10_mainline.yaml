name: cifar10_mainline
backend: pndm

base_config:
  dataset: cifar10
  metrics: [fid]
  num_gpus: 4
  prepare_schedules_first: true
  save_samples: false
  preview_samples: 8
  clock_config: configs/ablation/clocks/legacy_sadb/SADB_stork_loose_adaptive.yaml

model_assets:
  - pndm_model_ddim_cifar10
  - pndm_model_pf_cifar10
  - pndm_model_pf_deep_cifar10

solvers:
  - euler
  - deis
  - heun2
  - stork4_1st
  - stork4_2nd

schedules:
  - base
  - LEGACY_SADB

solver_schedules:
  euler: [base, LEGACY_SADB]
  heun2: [base, LEGACY_SADB]
  deis: [base]
  stork4_1st: [base, LEGACY_SADB]
  stork4_2nd: [base, LEGACY_SADB]

eval_nfes: [5, 7, 9, 11, 15, 23, 31]
