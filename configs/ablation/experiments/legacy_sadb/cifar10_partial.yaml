name: cifar10_partial
backend: pndm

base_config:
  dataset: cifar10
  metrics: [fid]
  num_gpus: 4
  prepare_schedules_first: true
  save_samples: false
  preview_samples: 8
  num_samples: 20000
  batch_size: 1024
  clock_config: configs/ablation/clocks/legacy_sadb/SADB_stork_loose_adaptive.yaml

model_assets:
  - pndm_model_ddim_cifar10

solvers:
  - stork4_1st
  - stork4_2nd

schedules:
  - base
  - LEGACY_SADB

solver_schedules:
  stork4_1st: [base, LEGACY_SADB]
  stork4_2nd: [base, LEGACY_SADB]

eval_nfes: [5, 7, 11]
