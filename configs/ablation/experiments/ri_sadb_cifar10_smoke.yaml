name: ri_sadb_cifar10_smoke
backend: pndm

base_config:
  dataset: cifar10
  metrics: []
  prepare_schedules_first: true
  save_samples: true
  preview_samples: 8
  num_samples: 16
  batch_size: 8
  clock_config: configs/ablation/clocks/legacy_sadb/SADB_stork_limited_smoke.yaml

model_assets:
  - pndm_model_ddim_cifar10

solvers:
  - euler

schedules:
  - base
  - SADB
  - RI_SADB

solver_schedules:
  euler: [base, SADB, RI_SADB]

schedule_clock_configs:
  SADB: configs/ablation/clocks/legacy_sadb/SADB_stork_limited_smoke.yaml
  RI_SADB:
    eta_0_00:
      path: configs/ablation/clocks/RI_SADB_cifar10_smoke_eta_0_00.yaml
    eta_0_25:
      path: configs/ablation/clocks/RI_SADB_cifar10_smoke.yaml
    eta_0_50:
      path: configs/ablation/clocks/RI_SADB_cifar10_smoke_eta_0_50.yaml
    eta_1_00:
      path: configs/ablation/clocks/RI_SADB_cifar10_smoke_eta_1_00.yaml

seeds: [0, 1]
eval_nfes: [10]
