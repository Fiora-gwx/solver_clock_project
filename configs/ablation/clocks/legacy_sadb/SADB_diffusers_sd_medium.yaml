clock:
  family: LEGACY_SADB
  calibration_solver: euler
  model_output_type: epsilon
  coordinate_domain: lambda
  physical_grid_size: 65
  physical_grid_mode: scheduler_sigmas
  pilot_batch_size: 8
  pilot_num_batches: 4
  pilot_observation_microbatch: 8
  pilot_prompt_asset: diffusers_practical_prompts
  smoothing_window: 3
  epsilon: 1.0e-12
  prior_schedule: ays
  prior_blend: 0.25
  density_temperature: 0.6
  q_prior: 3.0
  q_shrinkage: 0.5
  q_min: 1.5
  q_max: 4.0
  sde_q_prior: 2.2
  sde_q_shrinkage: 0.6
  sde_q_min: 1.3
  sde_q_max: 3.5
  defect_reduce: quantile
  defect_quantile: 0.75
  sde_noise_kappa: 0.3
  sde_brownian_bridge: false
  max_dt_factor: 1.5
  max_neighbor_dt_ratio: 1.8
  target_nfes: [10]
