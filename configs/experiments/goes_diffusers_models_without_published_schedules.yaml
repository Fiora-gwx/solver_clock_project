name: goes_diffusers_models_without_published_schedules
backend: diffusers
models:
  - sd35_medium
  - flux_dev
  - lumina_image_2
solvers:
  - flow_euler
schedules:
  - base
  - GOES
nfes:
  - 10
seeds:
  - 0
  - 1
  - 2
prompt_asset: diffusers_smoke_prompts
guidance_scales:
  - 3.5
metrics:
  - clipscore
  - imagereward
execution:
  num_gpus: 1
  materialize_schedules: false
  prepare_schedules_first: true
goes:
  batch_size: 2
  num_batches: 4
  microbatch_size: 1
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  physical_grid_mode: scheduler_sigmas
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
