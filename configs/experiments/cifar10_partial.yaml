name: cifar10_partial
backend: pndm
base_config:
  dataset: cifar10
  metrics: [fid]
  num_gpus: 4
  prepare_schedules_first: true
  save_samples: false
  preview_samples: 8
  num_samples: 20000
  batch_size: 1024
  clock_config: configs/clocks/SADB_partial_offline_fine.yaml
model_assets:
  - pndm_model_ddim_cifar10
solvers:
  - euler
  - stork4_1st
schedules:
  - SADB
solver_schedules:
  euler: [SADB]
  stork4_1st: [SADB]
eval_nfes: [5, 7, 11, 15]
