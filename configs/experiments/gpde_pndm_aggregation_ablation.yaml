name: gpde_pndm_aggregation_ablation
backend: pndm
dataset: cifar10
model_assets:
  - pndm_model_ddim_cifar10
solvers:
  - euler
schedules:
  - base
  - GPDE[aggregation_cvar]
  - GPDE[aggregation_mean]
nfes:
  - 5
  - 10
  - 15
seeds:
  - 0
num_samples: 5000
batch_size: 64
save_samples: false
preview_samples: 64
metrics:
  - fid
execution:
  num_gpus: 3
  gpu_ids: [0, 1, 2]
  materialize_schedules: true
  prepare_schedules_first: true
gpde:
  batch_size: 8
  num_batches: 4
  microbatch_size: 2
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  coordinate_domain: timesteps
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
schedule_clock_configs:
  GPDE:
    variants:
      aggregation_cvar: configs/goes/variants/aggregation_cvar.yaml
      aggregation_mean: configs/goes/variants/aggregation_mean.yaml
