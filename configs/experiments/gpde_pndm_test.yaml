name: gpde_pndm_test
backend: pndm
dataset: cifar10
solvers:
  - euler
  - ddim
  - deis
  - dpm_solver_lu
  - dpm_solver_default
  - dpm_solver_pp
  - unipc
  - stork4_1st
  - stork4_2nd
schedules:
  - base
  - GPDE
nfes:
  - 4
  - 5
  - 6
  - 8
  - 10
  - 12
seeds:
  - 0
num_samples: 5000
batch_size: 64
save_samples: false
preview_samples: 64
metrics:
  - fid
execution:
  num_gpus: 3
  gpu_ids: [0, 1, 2]
  materialize_schedules: true
  prepare_schedules_first: true
gpde:
  batch_size: 8
  num_batches: 4
  microbatch_size: 2
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
