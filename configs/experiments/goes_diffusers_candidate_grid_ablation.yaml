name: goes_diffusers_candidate_grid_ablation
backend: diffusers
models:
  - sd35_medium
solvers:
  - flow_euler
schedules:
  - base
  - GOES[candidate_m64]
  - GOES[candidate_m128]
  - GOES[candidate_m256]
  - GOES[candidate_m512]
  - GOES[candidate_m1024]
nfes:
  - 10
seeds:
  - 0
  - 1
  - 2
prompt_asset: diffusers_smoke_prompts
guidance_scales:
  - 7.5
metrics:
  - clipscore
  - imagereward
execution:
  num_gpus: 1
  materialize_schedules: false
  prepare_schedules_first: true
goes:
  batch_size: 4
  num_batches: 8
  microbatch_size: 1
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  physical_grid_mode: scheduler_sigmas
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
schedule_clock_configs:
  GOES:
    variants:
      candidate_m64: configs/goes/variants/probe_m64.yaml
      candidate_m128: configs/goes/variants/probe_m128.yaml
      candidate_m256: configs/goes/variants/probe_m256.yaml
      candidate_m512: configs/goes/variants/probe_m512.yaml
      candidate_m1024: configs/goes/variants/probe_m1024.yaml
