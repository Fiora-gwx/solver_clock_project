name: goes_pndm_oracle_convergence
backend: pndm
dataset: cifar10
model_assets:
  - pndm_model_ddim_cifar10
solvers:
  - euler
schedules:
  - base
  - GOES[ref_nfe_100]
  - GOES[ref_nfe_200]
  - GOES[ref_nfe_500]
  - GOES[ref_nfe_1000]
nfes:
  - 10
seeds:
  - 0
  - 1
  - 2
metrics:
  - fid
execution:
  num_gpus: 1
  materialize_schedules: false
  prepare_schedules_first: true
goes:
  batch_size: 8
  num_batches: 8
  microbatch_size: 4
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  coordinate_domain: timesteps
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
schedule_clock_configs:
  GOES:
    variants:
      ref_nfe_100: configs/goes/variants/ref_nfe_100.yaml
      ref_nfe_200: configs/goes/variants/ref_nfe_200.yaml
      ref_nfe_500: configs/goes/variants/ref_nfe_500.yaml
      ref_nfe_1000: configs/goes/variants/ref_nfe_1000.yaml
