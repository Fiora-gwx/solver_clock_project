name: gpde_diffusers_t2i_nfe10_pilot32_prompts50
backend: diffusers
models:
  - stable_diffusion_15
solvers:
  - euler
  - dpm_solver_pp
  - unipc
schedules:
  - base
  - GPDE
  - AYS
nfes:
  - 10
seeds:
  - 0
prompt_asset: diffusers_ablation_prompts
metrics:
  - clipscore
  - imagereward
execution:
  num_gpus: 2
  gpu_ids:
    - 0
    - 1
  materialize_schedules: true
  prepare_schedules_first: true
  skip_existing: true
gpde:
  batch_size: 4
  num_batches: 8
  microbatch_size: 1
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  physical_grid_mode: scheduler_sigmas
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
