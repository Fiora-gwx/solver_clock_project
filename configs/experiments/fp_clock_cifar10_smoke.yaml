name: fp_clock_cifar10_smoke
backend: pndm
dataset: cifar10
metrics:
  - fid
num_gpus: 1
prepare_schedules_first: true
materialize_schedules: false
save_samples: false
preview_samples: 4
num_samples: 100
batch_size: 16
clock_config: configs/clocks/FP_CLOCK.yaml
model_assets:
  - pndm_model_ddim_cifar10
solvers:
  - euler
schedules:
  - base
  - LEGACY_SADB
  - FP_CLOCK
schedule_clock_configs:
  LEGACY_SADB: configs/clocks/LEGACY_SADB.yaml
  FP_CLOCK: configs/clocks/FP_CLOCK.yaml
eval_nfes:
  - 5
  - 10
