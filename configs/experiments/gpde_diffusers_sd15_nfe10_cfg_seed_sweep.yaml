name: gpde_diffusers_sd15_nfe10_cfg_seed_sweep
backend: diffusers
models:
  - stable_diffusion_15
solvers:
  - euler
schedules:
  - base
  - GPDE
  - AYS
nfes:
  - 10
seeds:
  - 0
  - 1
  - 2
prompt_asset: diffusers_ablation_prompts
guidance_scales:
  - 5.0
  - 7.5
  - 10.0
metrics:
  - clipscore
  - imagereward
execution:
  num_gpus: 4
  gpu_ids:
    - 0
    - 1
    - 2
    - 3
  materialize_schedules: true
  prepare_schedules_first: true
  skip_existing: true
  continue_on_error: false
gpde:
  batch_size: 4
  num_batches: 8
  microbatch_size: 1
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  physical_grid_mode: scheduler_sigmas
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
