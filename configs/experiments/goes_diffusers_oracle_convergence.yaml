name: goes_diffusers_oracle_convergence
backend: diffusers
models:
  - sd35_medium
solvers:
  - flow_euler
schedules:
  - base
  - GOES[ref_nfe_100]
  - GOES[ref_nfe_200]
  - GOES[ref_nfe_500]
  - GOES[ref_nfe_1000]
nfes:
  - 10
seeds:
  - 0
  - 1
  - 2
prompt_asset: diffusers_smoke_prompts
guidance_scales:
  - 7.5
metrics:
  - clipscore
  - imagereward
execution:
  num_gpus: 1
  materialize_schedules: false
  prepare_schedules_first: true
goes:
  batch_size: 4
  num_batches: 8
  microbatch_size: 1
  ref_nfe: 256
  ref_grid_size: 257
  candidate_grid_size: 512
  physical_grid_mode: scheduler_sigmas
  metric: channel_whitened
  rho: 0.1
  aggregation: trimmed_mean
  trim_ratio: 0.10
schedule_clock_configs:
  GOES:
    variants:
      ref_nfe_100: configs/goes/variants/ref_nfe_100.yaml
      ref_nfe_200: configs/goes/variants/ref_nfe_200.yaml
      ref_nfe_500: configs/goes/variants/ref_nfe_500.yaml
      ref_nfe_1000: configs/goes/variants/ref_nfe_1000.yaml
