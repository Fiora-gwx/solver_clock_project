name: gpde_diffusers_rho_metric_ablation
backend: diffusers
models:
  - sd35_medium
solvers:
  - flow_euler
schedules:
  - base
  - GPDE[rho_0]
  - GPDE[rho_005]
  - GPDE[rho_01]
  - GPDE[rho_02]
  - GPDE[rho_05]
  - GPDE[rho_1]
  - GPDE[metric_identity]
  - GPDE[metric_edm_scalar]
  - GPDE[metric_channel_whitened]
nfes:
  - 10
seeds:
  - 0
  - 1
  - 2
prompt_asset: diffusers_smoke_prompts
guidance_scales:
  - 7.5
metrics:
  - clipscore
  - imagereward
execution:
  num_gpus: 1
  materialize_schedules: false
  prepare_schedules_first: true
gpde:
  batch_size: 4
  num_batches: 8
  microbatch_size: 1
  ref_nfe: 256
  ref_grid_size: 257
  probe_grid_size: 512
  physical_grid_mode: scheduler_sigmas
  metric: channel_whitened
  rho: 0.1
  aggregation: cvar
  trim_ratio: 0.10
schedule_clock_configs:
  GPDE:
    variants:
      rho_0: configs/goes/variants/rho_0.yaml
      rho_005: configs/goes/variants/rho_005.yaml
      rho_01: configs/goes/variants/rho_01.yaml
      rho_02: configs/goes/variants/rho_02.yaml
      rho_05: configs/goes/variants/rho_05.yaml
      rho_1: configs/goes/variants/rho_1.yaml
      metric_identity: configs/goes/variants/metric_identity.yaml
      metric_edm_scalar: configs/goes/variants/metric_edm_scalar.yaml
      metric_channel_whitened: configs/goes/variants/metric_channel_whitened.yaml
